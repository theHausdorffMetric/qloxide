[package]
name = "qloxide"
version = "0.1.0"
edition = "2024"
authors = ["Daniel Probst <dan@probst.dev>"]
description = "Financial instrument modeling, trade management, and pricing"
license = "GPL-3.0-or-later"
repository = "https://git.sr.ht/~danprobst/qloxide"
keywords = ["finance", "quantitative", "pricing", "instruments", "trading"]
categories = ["finance"]
readme = "README.md"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
typetag = "0.2"
rust_decimal = { version = "1", features = ["serde-with-str"] }
toml = "1.1"
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["cli"]
# The qloxide binary (clap-based report runner). Library consumers can
# opt out with default-features = false.
cli = ["dep:clap"]

[[bin]]
name = "qloxide"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3"
