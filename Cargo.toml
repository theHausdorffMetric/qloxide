[package]
name = "qloxide"
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
authors = ["Daniel Probst <dan@probst.dev>"]
description = "Financial instrument modeling, trade management, and pricing"
license = "GPL-3.0-or-later"
repository = "https://github.com/theHausdorffMetric/qloxide"
keywords = ["finance", "quantitative", "pricing", "instruments", "trading"]
categories = ["finance"]
readme = "README.md"
include = [
    "src/**",
    "tests/*.rs",
    "docs/**",
    "examples/bond_pricing/**",
    "examples/example-public/**",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/deny.toml",
    "/justfile",
]

[workspace]
members = ["analytics"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
jiff = { version = "0.2", features = ["serde"] }
libm = "0.2"
typetag = "0.2"
rust_decimal = { version = "1", features = ["serde-with-str"] }
toml = "1.1"
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["cli"]
# The qloxide-book / qloxide-risk binaries (clap-based report runners,
# architecture §9). Library consumers can opt out with
# default-features = false.
cli = ["dep:clap"]
# The generator seam (architecture §10): MarketSource trait, generic
# series engine, replay source, I5 conformance kit. Zero extra deps;
# gated so pure pricing consumers never see the producer-side API.
gen = []

[[bin]]
name = "qloxide-book"
path = "src/bin/book.rs"
required-features = ["cli"]

[[bin]]
name = "qloxide-risk"
path = "src/bin/risk.rs"
required-features = ["cli"]

[[example]]
name = "example-public"
path = "examples/example-public/main.rs"
required-features = ["gen"]

[dev-dependencies]
tempfile = "3"

[[test]]
name = "gen_replay"
required-features = ["gen"]
