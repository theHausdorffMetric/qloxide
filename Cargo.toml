[package]
name = "qloxide"
version = "0.2.0"
edition = "2024"
authors = ["Daniel Probst <dan@probst.dev>"]
description = "Financial instrument modeling, trade management, and pricing"
license = "MIT"
repository = "https://git.sr.ht/~danprobst/qloxide"
keywords = ["finance", "quantitative", "pricing", "instruments", "trading"]
categories = ["finance"]
readme = "README.md"
exclude = ["CLAUDE.md"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
typetag = "0.2"
rust_decimal = { version = "1", features = ["serde-with-str"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
