# PROTOTYPE (examples/proto — never shipped in the crate; see ../README.md).
#
# Brent Nov26 (X26) covered-call style book, struck 2026-08-20 intraday:
# long 10 of the 91 call @ 5.53, short 5 Nov26 futures (4 @ 91.04 + 1 @ 91.03).
# Reference settles that day: X26 future 91.97, 91 call 5.98 (ICE EOD).
# The future ceases trading 2026-09-30, the option expires 2026-09-25.
#
# Ids carry ICE's own contract codes (ARCHITECTURE.md §6.4): ICE-B-X26 is
# the Brent Crude Futures contract (ICE code B), ICE-BUL-X26-C-91 the
# cash-settled Brent European option (ICE code BUL). Mirrors the team-box
# book dpdev/ql/brent-option, which still carried the retired ICE-BRN-*
# commodity-symbol ids and a free-text "Brent" underlying; here the future
# settles against the registry node ICE-BRENT-INDEX like the committed books.
#
# market.json is the one-file market history (arch §9): every trading day
# from deal inception to the generation point, generated by qloxide-ice
# (2026-09-02, local icedata through 2026-09-01). Book data is vol-free —
# the risk-tier surfaces live in vols.json, wired via risk.toml.
#
#   just book             (all reports, valued at the last history day)
#   just day 2026-08-20   (what-if: current book vs one history day)
#   just series           (P&L across all history days)
instruments = ["instruments.json"]
indices = ["indices.json"]
deals = ["deals.json"]
market = "market.json"
reports = ["instruments", "deals", "positions", "pnl"]
