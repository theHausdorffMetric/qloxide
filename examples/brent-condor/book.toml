# Brent Sep26 78/83/88/93 iron condor, bought 2026-07-16 @ 2.80 net
# (10 lots/leg): a real book against real ICE EOD settlement data.
#
# market.json (and series/market-*.json) are generated by qloxide-ice
# (ideas repo: `just run brent-condor` / `just series brent-condor …`)
# from ICE cleared settlements, with vols re-implied from settlement
# premiums — every listed leg marks exactly at its ICE settle.
#
# Price from this directory (see the justfile here):
#   just book             (all reports, this file)
#   just day 2026-07-16   (P&L vs one series day)
#   just series           (P&L across all series days)
instruments = ["instruments.json"]
deals = ["deals.json"]
market_data = ["market.json"]
# Risk-tier vol surfaces (architecture §9): merged by qloxide-risk only;
# qloxide-book never reads them — book data is vol-free.
vol_data = ["vols.json"]
# Historical series (one market file per trading day + manifest): the
# loader checks settle-completeness for every cleared, dealt instrument
# over [deal inception, valuation date] against the manifest's coverage.
market_series = "series/manifest.json"
reports = ["instruments", "deals", "positions", "pnl"]
