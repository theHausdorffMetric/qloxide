# Brent Jul/Dec time spread: long 10 Jul26 (N26) / short 10 Dec26 (Z26),
# traded 2026-02-02 (first trading day of Feb) at that day's ICE settles
# — Jul 64.55 / Dec 63.26, i.e. long the spread at +1.29 backwardation.
#
# The Jul leg CEASES TRADING 2026-05-29 (Brent futures expire two months
# before delivery): from June the book is an outright Dec26 short, and
# the Jul leg's P&L freezes at its final settle (realized). The series
# (`just series`) shows exactly that.
#
# market.json + series/ are generated by qloxide-ice (ideas repo:
# `just run brent-timespread` / `just series brent-timespread …`) from
# ICE cleared settlements.
instruments = ["instruments.json"]
deals = ["deals.json"]
market_data = ["market.json"]
market_series = "series/manifest.json"
reports = ["instruments", "deals", "positions", "pnl"]
